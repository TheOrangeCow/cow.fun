<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chopstick Fly Squash - cow.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF6;
            --ink: #17161A;
            --ink-soft: #4A4850;
            --orange: #FF6B2C;
            --pink: #FF4FA0;
            --line: rgba(23, 22, 26, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(16px, 4vw, 48px);
        }

        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
        }

        a.back:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .score-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--ink);
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
        }

        .title-block {
            text-align: center;
            padding: 6px 20px 10px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 44px);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--ink-soft);
            min-height: 20px;
            transition: opacity .15s ease;
        }

        #arena {
            position: relative;
            flex: 1;
            margin: 10px clamp(12px, 3vw, 40px) clamp(16px, 4vw, 40px);
            border: 2px dashed var(--line);
            border-radius: 24px;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 107, 44, 0.05), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 79, 160, 0.06), transparent 40%);
            min-height: 420px;
            cursor: none;
        }

        .fly {
            position: absolute;
            font-size: 26px;
            line-height: 1;
            transition: left 0.85s cubic-bezier(.45, .05, .55, .95), top 0.85s cubic-bezier(.45, .05, .55, .95), transform 0.2s ease;
            filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.15));
            transform-origin: center;
            will-change: left, top;
            z-index: 3;
        }

        .fly.squashed {
            transition: transform .25s ease, opacity .35s ease .1s;
            transform: scale(1.4, 0.25) rotate(0deg) !important;
            opacity: 0;
            pointer-events: none;
        }

        .splat {
            position: absolute;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--ink);
            padding: 4px 10px;
            border-radius: 8px;
            pointer-events: none;
            animation: floatUp .9s ease forwards;
            z-index: 6;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-38px);
            }
        }

        #sticks {
            position: fixed;
            width: 4px;
            height: 4px;
            pointer-events: none;
            z-index: 10;
            transform: translate(-2px, -2px);
        }

        .stick {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 8px;
            height: 130px;
            border-radius: 6px;
            background: linear-gradient(180deg, #C98A4B, #8B5A2B);
            box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.15);
            transform-origin: bottom center;
            transition: transform .12s cubic-bezier(.4, 0, .2, 1);
        }

        .stick.left {
            transform: translateX(-9px) rotate(-11deg);
        }

        .stick.right {
            transform: translateX(1px) rotate(11deg);
        }

        #sticks.closed .stick.left {
            transform: translateX(-3px) rotate(-2deg);
        }

        #sticks.closed .stick.right {
            transform: translateX(-5px) rotate(2deg);
        }

        .milestone-toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--ink);
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            z-index: 20;
            animation: milestonePop 2.2s ease forwards;
            white-space: nowrap;
        }

        @keyframes milestonePop {
            0% {
                opacity: 0;
                transform: translate(-50%, -8px);
            }

            12% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            85% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -8px);
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="back" href="index.html">← cow.fun</a>
        <div class="score-tag">squashed: <span id="score">0</span></div>
    </header>

    <div class="title-block">
        <h1>Chopstick Fly Squash</h1>
        <div class="caption" id="caption">they never stop coming.</div>
    </div>

    <div id="arena">
        <div id="sticks">
            <div class="stick left"></div>
            <div class="stick right"></div>
        </div>
    </div>

    <script>
        const arena = document.getElementById('arena');
        const sticks = document.getElementById('sticks');
        const scoreEl = document.getElementById('score');
        const captionEl = document.getElementById('caption');

        let score = 0;
        let flies = [];
        let flyId = 0;

        const captions = [
            "they never stop coming.",
            "one down.",
            "not bad.",
            "they're getting suspicious.",
            "the flies are regrouping.",
            "your aim is improving.",
            "more flies inbound.",
            "this is basically a massacre.",
            "the chopsticks approves.",
            "getting fast now.",
            "they can't keep up with you.",
            "legendary chopstick work.",
            "somewhere, a fly is scared.",
            "infinite flies, infinite glory.",
            "you are a pro now."
        ];

        const milestones = {
            10: "10 squashed. warming up.",
            25: "25. the flies are talking about you.",
            50: "50. this is a hobby now.",
            100: "100. certified fly menace.",
            250: "250?! ok, go outside maybe."
        };

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function arenaBounds() {
            const r = arena.getBoundingClientRect();
            return { w: r.width, h: r.height };
        }

        function updateCaption() {
            captionEl.style.opacity = 0;
            setTimeout(() => {
                captionEl.textContent = captions[Math.min(score, captions.length - 1)];
                captionEl.style.opacity = 1;
            }, 120);
        }

        function showMilestone(text) {
            const t = document.createElement('div');
            t.className = 'milestone-toast';
            t.textContent = text;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2200);
        }

        function showSplat(x, y) {
            const t = document.createElement('div');
            t.className = 'splat';
            t.textContent = 'splat! +1';
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            arena.appendChild(t);
            setTimeout(() => t.remove(), 900);
        }

        function targetFlyCount() {
            return Math.min(14, 3 + Math.floor(score / 5));
        }

        function spawnFly() {
            const { w, h } = arenaBounds();
            const id = flyId++;
            const el = document.createElement('div');
            el.className = 'fly';
            el.textContent = '🪰';
            const x = rand(10, Math.max(10, w - 30));
            const y = rand(10, Math.max(10, h - 30));
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            arena.appendChild(el);

            const fly = { id, el, x, y, dir: 1 };
            flies.push(fly);

            el.addEventListener('mouseenter', () => scheduleMove(fly, true));
            el.addEventListener('click', (e) => squash(fly));

            scheduleMove(fly, false);
            return fly;
        }

        function scheduleMove(fly, immediate) {
            if (fly.timer) clearTimeout(fly.timer);
            const move = () => {
                if (!fly.el || !fly.el.isConnected) return;
                const { w, h } = arenaBounds();
                const speedFactor = Math.max(0.35, 1 - score * 0.01);
                const nx = rand(6, Math.max(6, w - 32));
                const ny = rand(6, Math.max(6, h - 32));
                if (nx < fly.x) fly.el.style.transform = 'scaleX(-1)';
                else fly.el.style.transform = 'scaleX(1)';
                fly.el.style.transition = `left ${0.5 + speedFactor * 0.6}s cubic-bezier(.45,.05,.55,.95), top ${0.5 + speedFactor * 0.6}s cubic-bezier(.45,.05,.55,.95), transform .2s ease`;
                fly.x = nx;
                fly.y = ny;
                fly.el.style.left = nx + 'px';
                fly.el.style.top = ny + 'px';
                const nextDelay = rand(500, 1100) * Math.max(0.4, 1 - score * 0.008);
                fly.timer = setTimeout(move, nextDelay);
            };
            fly.timer = setTimeout(move, immediate ? 0 : rand(200, 900));
        }

        function squash(fly) {
            if (fly.squashed) return;
            fly.squashed = true;
            if (fly.timer) clearTimeout(fly.timer);
            fly.el.classList.add('squashed');

            const x = parseFloat(fly.el.style.left) + 10;
            const y = parseFloat(fly.el.style.top);
            showSplat(x, y);

            score++;
            scoreEl.textContent = score;
            updateCaption();

            if (milestones[score]) showMilestone(milestones[score]);

            setTimeout(() => {
                fly.el.remove();
                flies = flies.filter(f => f.id !== fly.id);
            }, 400);

            maintainFlyCount();
        }

        function maintainFlyCount() {
            const target = targetFlyCount();
            while (flies.filter(f => !f.squashed).length < target) {
                spawnFly();
            }
        }

        arena.addEventListener('mousemove', (e) => {
            sticks.style.left = e.clientX + 'px';
            sticks.style.top = e.clientY + 'px';
        });

        arena.addEventListener('mouseenter', () => { sticks.style.display = 'block'; });
        arena.addEventListener('mouseleave', () => { sticks.style.display = 'none'; });

        arena.addEventListener('mousedown', () => sticks.classList.add('closed'));
        window.addEventListener('mouseup', () => sticks.classList.remove('closed'));

        arena.addEventListener('click', () => { });

        sticks.style.display = 'none';

        window.addEventListener('resize', () => {
            const { w, h } = arenaBounds();
            flies.forEach(f => {
                f.x = Math.min(f.x, w - 30);
                f.y = Math.min(f.y, h - 30);
                f.el.style.left = f.x + 'px';
                f.el.style.top = f.y + 'px';
            });
        });

        maintainFlyCount();
    </script>

</body>

</html>
