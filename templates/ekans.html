<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Button - cow.fun</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF6;
            --ink: #17161A;
            --ink-soft: #4A4850;
            --orange: #FF6B2C;
            --pink: #FF4FA0;
            --line: rgba(23, 22, 26, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(16px, 4vw, 48px);
        }

        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
        }

        a.back:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .score-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--ink);
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
        }

        .title-block {
            text-align: center;
            padding: 6px 20px 10px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 44px);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--ink-soft);
            min-height: 20px;
            transition: opacity .15s ease;
        }

        #arena {
            position: relative;
            flex: 1;
            margin: 10px clamp(12px, 3vw, 40px) clamp(16px, 4vw, 40px);
            border: 2px dashed var(--line);
            border-radius: 24px;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 107, 44, 0.05), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 79, 160, 0.06), transparent 40%);
            min-height: 420px;
        }

        .btn {
            position: absolute;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            color: #fff;
            background: var(--orange);
            box-shadow: 0 6px 0 var(--ink);
            cursor: pointer;
            user-select: none;
            transition: left .18s cubic-bezier(.34, 1.56, .64, 1), top .18s cubic-bezier(.34, 1.56, .64, 1), width .2s ease, height .2s ease, font-size .2s ease, background .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 10px;
            line-height: 1.1;
        }

        .btn:active {
            box-shadow: 0 2px 0 var(--ink);
            transform: translateY(4px);
        }

        .btn.decoy {
            background: #fff;
            color: var(--ink);
            border: 2px solid var(--ink);
            box-shadow: 0 6px 0 var(--line);
            opacity: .85;
        }

        .toast {
            position: absolute;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--ink);
            padding: 4px 10px;
            border-radius: 8px;
            pointer-events: none;
            animation: floatUp 1s ease forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-40px);
            }
        }

        #winOverlay {
            position: fixed;
            inset: 0;
            background: rgba(23, 22, 26, 0.9);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            z-index: 50;
            padding: 20px;
        }

        #winOverlay h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(30px, 6vw, 52px);
            margin: 0 0 14px;
        }

        #winOverlay p {
            font-family: 'IBM Plex Mono', monospace;
            max-width: 420px;
            color: #ddd;
            margin: 0 0 24px;
        }

        #winOverlay button {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
        }

        #game {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <header>
        <a class="back" href="index.html">← cow.fun</a>
        <div class="score-tag">snake length: <span id="score">0</span></div>
    </header>

    <div class="title-block">
        <h1>ekanS</h1>
        <div class="caption" id="caption">eat to srink</div>
    </div>

    <div id="arena">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="winOverlay">
        <h2>tiny snake achevend.</h2>
        <p>you ate the pink square 499 times you need to get a life.</p>
        <button onclick="location.reload()">go again</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const arena = document.getElementById("arena");
        const score = document.getElementById("score");

        const CELL_SIZE = 12;

        let cols;
        let rows;

        function resizeCanvas() {
            canvas.width = arena.clientWidth;
            canvas.height = arena.clientHeight;

            cols = Math.floor(canvas.width / CELL_SIZE);
            rows = Math.floor(canvas.height / CELL_SIZE);
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        let snake = [];

        for (let i = 0; i < 500; i++) {
            snake.push({
                x: Math.floor(cols / 2) - i,
                y: Math.floor(rows / 2)
            });
        }

        let dx = 1;
        let dy = 0;

        function spawnFood() {
            let foodPos;

            do {
                foodPos = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } while (
                snake.some(
                    s => s.x === foodPos.x &&
                        s.y === foodPos.y
                )
            );

            return foodPos;
        }

        let food = spawnFood();

        document.addEventListener("keydown", (e) => {

            const key = e.key.toLowerCase();

            if ((e.key === "ArrowUp" || key === "w") && dy === 0) {
                dx = 0;
                dy = -1;
            }

            if ((e.key === "ArrowDown" || key === "s") && dy === 0) {
                dx = 0;
                dy = 1;
            }

            if ((e.key === "ArrowLeft" || key === "a") && dx === 0) {
                dx = -1;
                dy = 0;
            }

            if ((e.key === "ArrowRight" || key === "d") && dx === 0) {
                dx = 1;
                dy = 0;
            }
        });

        function update() {

            let head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            if (head.x < 0) head.x = cols - 1;
            if (head.y < 0) head.y = rows - 1;

            if (head.x >= cols) head.x = 0;
            if (head.y >= rows) head.y = 0;

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {

                if (snake.length > 1) {
                    snake.pop();
                }

                food = spawnFood();
            }

            snake.pop();

            score.textContent = snake.length;

            if (snake.length <= 1) {
                winOverlay.style.display = "flex";
                clearInterval(loop);
            }
        }

        function draw() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // food
            ctx.fillStyle = "#FF4FA0";
            ctx.fillRect(
                food.x * CELL_SIZE,
                food.y * CELL_SIZE,
                CELL_SIZE,
                CELL_SIZE
            );

            // snake
            snake.forEach((part, index) => {

                ctx.fillStyle =
                    index === 0
                        ? "#17161A"
                        : "#FF6B2C";

                ctx.fillRect(
                    part.x * CELL_SIZE,
                    part.y * CELL_SIZE,
                    CELL_SIZE,
                    CELL_SIZE
                );
            });
        }

        const loop = setInterval(() => {
            update();
            draw();
        }, 80);

        score.textContent = snake.length;
    </script>

</body>

</html>
