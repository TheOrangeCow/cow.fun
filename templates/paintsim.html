<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Simulator - cow.fun</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF6;
            --ink: #17161A;
            --ink-soft: #4A4850;
            --orange: #FF6B2C;
            --pink: #FF4FA0;
            --purple: #6C4CFF;
            --green: #2E9E5B;
            --line: rgba(23, 22, 26, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(16px, 4vw, 48px);
        }

        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
        }

        a.back:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .score-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--green);
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
            transition: background .3s ease;
        }

        .title-block {
            text-align: center;
            padding: 6px 20px 10px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 44px);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--ink-soft);
            min-height: 20px;
            transition: opacity .15s ease;
        }

        #arena {
            position: relative;
            flex: 1;
            margin: 10px clamp(12px, 3vw, 40px) clamp(16px, 4vw, 40px);
            border: 2px dashed var(--line);
            border-radius: 24px;
            overflow: hidden;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 18px;
            border-bottom: 2px dashed var(--line);
            z-index: 5;
            background: rgba(253, 252, 246, 0.9);
        }

        .swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            cursor: pointer;
            padding: 0;
            transition: transform .12s ease;
        }

        .swatch.active {
            transform: scale(1.22);
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
        }

        .tool-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 2px solid var(--ink);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
        }

        .tool-btn.bucket {
            background: var(--purple);
            color: #fff;
            border-color: var(--purple);
            margin-left: auto;
        }

        .tool-btn.clear {
            background: #fff;
        }

        .canvas-wrap {
            position: relative;
            flex: 1;
            cursor: crosshair;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #fxCanvas {
            pointer-events: none;
        }

        #winOverlay {
            position: fixed;
            inset: 0;
            background: rgba(23, 22, 26, 0.92);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            z-index: 50;
            padding: 20px;
        }

        #winOverlay h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(30px, 6vw, 52px);
            margin: 0 0 14px;
        }

        #winOverlay p {
            font-family: 'IBM Plex Mono', monospace;
            max-width: 440px;
            color: #ddd;
            margin: 0 0 24px;
        }

        #winOverlay button {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--green);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <a class="back" href="index.html">← cow.fun</a>
        <div class="score-tag">chaos: <span id="chaosVal">0</span></div>
    </header>

    <div class="title-block">
        <h1>Paint Simulator</h1>
        <div class="caption" id="caption">a simple, calm, well-behaved paint app.</div>
    </div>

    <div id="arena">
        <div class="toolbar">
            <button class="swatch active" style="background:#17161A" data-color="#17161A"></button>
            <button class="swatch" style="background:#FF6B2C" data-color="#FF6B2C"></button>
            <button class="swatch" style="background:#FF4FA0" data-color="#FF4FA0"></button>
            <button class="swatch" style="background:#6C4CFF" data-color="#6C4CFF"></button>
            <button class="swatch" style="background:#2E9E5B" data-color="#2E9E5B"></button>
            <button class="swatch" style="background:#3CB6FF" data-color="#3CB6FF"></button>
            <button class="tool-btn clear" id="clearBtn">clear</button>
            <button class="tool-btn bucket" id="bucketBtn">bucket</button>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="paintCanvas"></canvas>
            <canvas id="fxCanvas"></canvas>
        </div>
    </div>

    <div id="winOverlay">
        <h2>the bucket won.</h2>
        <p>The canvas has been fully flooded. There is no more painting to be done here. Everything is one color now.
        </p>
        <button onclick="location.reload()">start a new canvas</button>
    </div>

    <script>
        const wrap = document.getElementById('canvasWrap');
        const paintCanvas = document.getElementById('paintCanvas');
        const fxCanvas = document.getElementById('fxCanvas');
        const pctx = paintCanvas.getContext('2d');
        const fctx = fxCanvas.getContext('2d');
        const chaosEl = document.getElementById('chaosVal');
        const captionEl = document.getElementById('caption');
        const winOverlay = document.getElementById('winOverlay');
        const bucketBtn = document.getElementById('bucketBtn');
        const clearBtn = document.getElementById('clearBtn');

        let strokeCount = 0;
        let currentColor = '#17161A';
        let baseHue = 0, baseSat = 0, baseLight = 10;
        let done = false;

        const captions = [
            "a simple, calm, well-behaved paint app.",
            "look at that. perfectly normal brush strokes.",
            "the paint is starting to drip a little.",
            "is it just you, or is the brush... lagging?",
            "the brush has developed a mind of its own.",
            "the colors don't seem to be listening to you anymore.",
            "something on the canvas just moved by itself.",
            "the canvas is actively resisting you now.",
            "careful with that bucket.",
        ];

        function updateCaption() {
            const idx = Math.min(Math.floor(strokeCount / 5), captions.length - 1);
            captionEl.textContent = captions[idx];
        }

        function resize() {
            const r = wrap.getBoundingClientRect();
            [paintCanvas, fxCanvas].forEach(c => {
                const img = (c === paintCanvas) ? paintCanvas.toDataURL?.() : null;
                c.width = r.width;
                c.height = r.height;
            });
        }
        resize();
        window.addEventListener('resize', resize);

        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h *= 60;
            }
            return { h, s: s * 100, l: l * 100 };
        }

        document.querySelectorAll('.swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                currentColor = sw.dataset.color;
                const hsl = hexToHsl(currentColor);
                baseHue = hsl.h; baseSat = hsl.s; baseLight = hsl.l;
            });
        });

        function activeColor() {
            if (strokeCount >= 15) {
                const hue = (baseHue + hueOffset) % 360;
                return `hsl(${hue}, ${Math.max(baseSat, 55)}%, ${Math.min(Math.max(baseLight, 40), 60)}%)`;
            }
            return currentColor;
        }

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let brushX = 0, brushY = 0;
        let mouseX = 0, mouseY = 0;
        let hueOffset = 0;
        let drips = [];

        function getPos(e) {
            const r = paintCanvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - r.left, y: t.clientY - r.top };
        }

        function startDraw(e) {
            if (done) return;
            isDrawing = true;
            strokeCount++;
            chaosEl.textContent = strokeCount;
            updateCaption();
            const p = getPos(e);
            lastX = brushX = mouseX = p.x;
            lastY = brushY = mouseY = p.y;
            drawDot(p.x, p.y);
        }

        function moveDraw(e) {
            const p = getPos(e);
            mouseX = p.x; mouseY = p.y;
            if (!isDrawing) return;
            if (strokeCount < 10) {
                drawLine(lastX, lastY, mouseX, mouseY);
                lastX = mouseX; lastY = mouseY;
                maybeDrip(mouseX, mouseY);
            }
        }

        function endDraw() { isDrawing = false; }

        function drawDot(x, y) {
            pctx.fillStyle = activeColor();
            pctx.beginPath();
            pctx.arc(x, y, 4, 0, Math.PI * 2);
            pctx.fill();
        }

        function drawLine(x1, y1, x2, y2) {
            pctx.strokeStyle = activeColor();
            pctx.lineWidth = 7;
            pctx.lineCap = 'round';
            pctx.lineJoin = 'round';
            pctx.beginPath();
            pctx.moveTo(x1, y1);
            pctx.lineTo(x2, y2);
            pctx.stroke();
        }

        function maybeDrip(x, y) {
            if (strokeCount < 5) return;
            if (Math.random() < 0.28) {
                drips.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: 0.3 + Math.random() * 0.6,
                    r: 2 + Math.random() * 3.5,
                    color: activeColor(),
                    life: 1
                });
            }
        }

        paintCanvas.addEventListener('mousedown', startDraw);
        window.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', endDraw);
        paintCanvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); }, { passive: false });
        window.addEventListener('touchmove', (e) => { moveDraw(e); }, { passive: true });
        window.addEventListener('touchend', endDraw);

        clearBtn.addEventListener('click', () => {
            if (done) return;
            pctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        });

        setInterval(() => {
            if (done) return;
            if (strokeCount < 20) return;
            const x = Math.random() * paintCanvas.width;
            const y = Math.random() * paintCanvas.height;
            const palette = ['#FF6B2C', '#FF4FA0', '#6C4CFF', '#2E9E5B', '#3CB6FF'];
            pctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
            pctx.beginPath();
            pctx.arc(x, y, 10 + Math.random() * 18, 0, Math.PI * 2);
            pctx.fill();
        }, 750);

        let flooding = false;
        bucketBtn.addEventListener('click', () => {
            if (done || flooding) return;
            flooding = true;
            const full = strokeCount >= 15;
            const cx = paintCanvas.width / 2, cy = paintCanvas.height / 2;
            const maxR = full
                ? Math.hypot(paintCanvas.width, paintCanvas.height) * 0.6
                : 120;
            const color = activeColor();
            let r = 0;
            const speed = full ? 14 : 8;

            function step() {
                r += speed;
                fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                fctx.fillStyle = color;
                fctx.beginPath();
                fctx.arc(cx, cy, r, 0, Math.PI * 2);
                fctx.fill();
                if (r < maxR) {
                    requestAnimationFrame(step);
                } else {
                    pctx.fillStyle = color;
                    pctx.beginPath();
                    pctx.arc(cx, cy, r, 0, Math.PI * 2);
                    pctx.fill();
                    fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                    flooding = false;
                    if (full) {
                        done = true;
                        setTimeout(() => { winOverlay.style.display = 'flex'; }, 300);
                    }
                }
            }
            requestAnimationFrame(step);
        });

        function tick() {
            if (strokeCount >= 15) hueOffset += 1.4;

            if (isDrawing && strokeCount >= 10 && strokeCount < 20 && !done) {
                brushX += (mouseX - brushX) * 0.18;
                brushY += (mouseY - brushY) * 0.18;
                drawLine(lastX, lastY, brushX, brushY);
                lastX = brushX; lastY = brushY;
                maybeDrip(brushX, brushY);
            } else if (isDrawing && strokeCount >= 20 && !done) {
                brushX += (mouseX - brushX) * 0.18 + (Math.random() - 0.5) * 10;
                brushY += (mouseY - brushY) * 0.18 + (Math.random() - 0.5) * 10;
                drawLine(lastX, lastY, brushX, brushY);
                lastX = brushX; lastY = brushY;
                maybeDrip(brushX, brushY);
            }

            if (drips.length) {
                fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                drips = drips.filter(d => d.life > 0 && d.y < fxCanvas.height + 20);
                drips.forEach(d => {
                    d.vy += 0.05;
                    d.x += d.vx;
                    d.y += d.vy;
                    d.life -= 0.006;
                    fctx.globalAlpha = Math.max(0, d.life);
                    fctx.fillStyle = d.color;
                    fctx.beginPath();
                    fctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    fctx.fill();
                });
                fctx.globalAlpha = 1;
            } else if (!flooding) {
                fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            }

            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    </script>

</body>

</html>
