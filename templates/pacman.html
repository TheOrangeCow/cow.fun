<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac Man - cow.fun</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='pacman/css/style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF6;
            --ink: #17161A;
            --ink-soft: #4A4850;
            --orange: #FF6B2C;
            --pink: #FF4FA0;
            --line: rgba(23, 22, 26, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(16px, 4vw, 48px);
        }

        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
        }

        a.back:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .score-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--ink);
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
        }

        .title-block {
            text-align: center;
            padding: 6px 20px 10px;
        }

        .cowh1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 44px);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--ink-soft);
            min-height: 20px;
            transition: opacity .15s ease;
        }

        #arena {
            position: relative;
            flex: 1;
            margin: 10px clamp(12px, 3vw, 40px) clamp(16px, 4vw, 40px);
            border: 2px dashed var(--line);
            border-radius: 24px;
            min-height: 420px;
        }

        .btn {
            position: absolute;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            color: #fff;
            background: var(--orange);
            box-shadow: 0 6px 0 var(--ink);
            cursor: pointer;
            user-select: none;
            transition: left .18s cubic-bezier(.34, 1.56, .64, 1), top .18s cubic-bezier(.34, 1.56, .64, 1), width .2s ease, height .2s ease, font-size .2s ease, background .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 10px;
            line-height: 1.1;
        }

        .btn:active {
            box-shadow: 0 2px 0 var(--ink);
            transform: translateY(4px);
        }

        .btn.decoy {
            background: #fff;
            color: var(--ink);
            border: 2px solid var(--ink);
            box-shadow: 0 6px 0 var(--line);
            opacity: .85;
        }

        .toast {
            position: absolute;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--ink);
            padding: 4px 10px;
            border-radius: 8px;
            pointer-events: none;
            animation: floatUp 1s ease forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-40px);
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="back" href="index.html">← cow.fun</a>
        <div class="score-tag">score: <span id="score">0</span></div>
    </header>

    <div class="title-block">
        <h1 class="cowh1">PAC - MAN</h1>
        <div class="caption" id="caption">Multiplayer</div>
    </div>

    <div id="arena">

        <div id="lobby-screen" class="screen">
            <h1 class="arcade-title">PAC-MAN</h1>
            <div class="arcade-subtitle">Multiplayer</div>

            <div class="lobby-card">
                <label>YOUR NAME</label>
                <input id="name-input" maxlength="12" placeholder="PLAYER1" autocomplete="off">

                <label>ROOM CODE <span class="hint">(leave blank to create one)</span></label>
                <input id="room-input" maxlength="4" placeholder="ABCD" autocomplete="off"
                    style="text-transform:uppercase">

                <button id="join-btn" class="arcade-btn">JOIN</button>
                <div id="lobby-error" class="lobby-error"></div>
            </div>

            <div id="room-panel" class="room-panel hidden">
                <div class="room-code-display">ROOM: <span id="room-code-label"></span></div>
                <div id="roster" class="roster"></div>
                <button id="start-btn" class="arcade-btn">START GAME</button>
                <div class="tip">Share the room code so friends can join &amp; help clear the dots together.</div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="hud">
                <div class="hud-col">
                    <div class="hud-label">HIGH SCORE</div>
                    <div id="hud-highscore" class="hud-value">00</div>
                </div>
                <div class="hud-col">
                    <div class="hud-label">TEAM SCORE</div>
                    <div id="hud-score" class="hud-value">00</div>
                </div>
                <div class="hud-col">
                    <div class="hud-label">DOTS LEFT</div>
                    <div id="hud-dots" class="hud-value">--</div>
                </div>
            </div>

            <div class="canvas-wrap">
                <canvas id="game-canvas"></canvas>
                <div id="overlay-message" class="overlay-message hidden"></div>
            </div>

            <div id="players-panel" class="players-panel"></div>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='pacman/js/game.js') }}"></script>
</body>

</html>
