<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - cow.fun</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF6;
            --ink: #17161A;
            --ink-soft: #4A4850;
            --green: #2E9E5B;
            --orange: #FF6B2C;
            --line: rgba(23, 22, 26, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(16px, 4vw, 48px);
        }

        a.back {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
        }

        a.back:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .score-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            background: var(--green);
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
        }

        .title-block {
            text-align: center;
            padding: 6px 20px 10px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 5vw, 44px);
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .caption {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: var(--ink-soft);
            min-height: 20px;
        }

        #arena {
            position: relative;
            flex: 1;
            margin: 10px clamp(12px, 3vw, 40px) clamp(16px, 4vw, 40px);
            border: 2px dashed var(--line);
            border-radius: 24px;
            overflow: hidden;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: min(480px, 100%);
            padding: 40px 30px;
            text-align: center;
        }

        .stage-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px;
            color: var(--ink);
            margin-bottom: 18px;
            min-height: 22px;
        }

        .progress-track {
            width: 100%;
            height: 16px;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.3s linear;
        }

        .pct {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .loop-log {
            margin-top: 26px;
            text-align: left;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            max-height: 130px;
            overflow-y: auto;
            border-top: 1px dashed var(--line);
            padding-top: 12px;
        }

        .loop-log div {
            padding: 2px 0;
            opacity: 0.8;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(23, 22, 26, 0.94);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            z-index: 50;
            padding: 20px;
        }

        #overlay h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(30px, 7vw, 52px);
            margin: 0 0 14px;
        }

        #overlay p {
            font-family: 'IBM Plex Mono', monospace;
            max-width: 440px;
            color: #ddd;
            margin: 0 0 26px;
        }

        #overlay button {
            font-family: 'IBM Plex Mono', monospace;
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            background: var(--green);
        }
    </style>
</head>

<body>

    <header>
        <a class="back" href="index.html">← cow.fun</a>
        <div class="score-tag">loops: <span id="loopCount">0</span></div>
    </header>

    <div class="title-block">
        <h1>Loading...</h1>
        <div class="caption" id="caption">please wait. this will not take long.</div>
    </div>

    <div id="arena">
        <div class="card">
            <div class="stage-label" id="stageLabel">connecting...</div>
            <div class="progress-track">
                <div class="progress-fill" id="fill"></div>
            </div>
            <div class="pct" id="pct">0%</div>
            <div class="loop-log" id="log"></div>
        </div>
    </div>

    <div id="overlay">
        <h2>it's done.</h2>
        <p>There was never a website. There was never a file. You just watched a bar fill up eight times. Thank you for
            your patience.</p>
        <button onclick="location.reload()">load it again, why not</button>
    </div>

    <script>
        const fill = document.getElementById('fill');
        const pct = document.getElementById('pct');
        const stageLabel = document.getElementById('stageLabel');
        const log = document.getElementById('log');
        const loopCountEl = document.getElementById('loopCount');
        const captionEl = document.getElementById('caption');
        const overlay = document.getElementById('overlay');

        const stages = [
            'locating the website',
            'downloading',
            'extracting file',
            'reading file',
            'pondering',
            'chatting to my friend',
            'sleeping',
            'extracting file (again)',
            'downloading (still)',
            'verifying nothing in particular',
            'reticulating splines',
            'asking around',
            'downloading (for real this time)',
        ];

        const captions = [
            "please wait. this will not take long.",
            "still working on it.",
            "this is a normal amount of loading.",
            "we're getting somewhere. probably.",
            "the file has been found. sort of.",
            "please continue to wait.",
            "loading has become a lifestyle.",
            "you could leave. you won't.",
        ];

        let loopCount = 0;
        let stageIdx = 0;
        const MAX_LOOPS = 8;

        function logLine(text) {
            const d = document.createElement('div');
            d.textContent = text;
            log.prepend(d);
        }

        function runStage() {
            if (loopCount >= MAX_LOOPS) {
                overlay.style.display = 'flex';
                return;
            }
            const name = stages[stageIdx % stages.length];
            stageLabel.textContent = name + '...';
            fill.style.width = '0%';
            pct.textContent = '0%';

            let p = 0;
            const duration = 900 + Math.random() * 900;
            const start = Date.now();

            function step() {
                const t = Math.min(1, (Date.now() - start) / duration);
                p = Math.round(t * 100);
                fill.style.width = p + '%';
                pct.textContent = p + '%';
                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    logLine('✓ ' + name);
                    stageIdx++;
                    if (stageIdx % stages.length === 0) {
                        loopCount++;
                        loopCountEl.textContent = loopCount;
                        captionEl.textContent = captions[Math.min(loopCount, captions.length - 1)];
                    }
                    setTimeout(runStage, 250);
                }
            }
            requestAnimationFrame(step);
        }

        runStage();
    </script>

</body>

</html>
